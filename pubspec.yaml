name: ereader
description: "A Flutter EPUB reader application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_epub_viewer: ^1.2.6
  provider: ^6.1.2
  file_picker: ^8.0.0+1
  shared_preferences: ^2.5.4
  archive: ^4.0.7
  path_provider: ^2.1.5
  path: ^1.9.1
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon_square.png"
  min_sdk_android: 21
